<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Developer Tools — LUTFITECH</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="bg-grid"></div><div class="orb orb-a"></div><div class="orb orb-b"></div><header class="topbar"><a class="brand" href="../index.html"><span>LUTFI</span>TECH</a><button class="menu-btn" id="menuBtn">☰</button><nav id="nav"><a href="../index.html">Beranda</a><a href="dashboard.html">Dashboard</a><a href="network.html">Network Lab</a><a href="tools.html">Tools</a><a href="speedtest.html">Pengujian</a><a href="monitor.html">Monitor</a><a href="server.html">Server</a><a href="help.html">Bantuan</a></nav></header><main><section class="section page-enter"><span class="kicker">LUTFITECH</span><h1 style="font:700 clamp(2rem,6vw,4rem) 'Space Grotesk';margin:8px 0 12px">Developer Tools</h1>
<div class="grid three">
<div class="card"><i>{ }</i><h3>JSON Formatter</h3><textarea id="json" rows="8" placeholder='{"nama":"LUTFITECH","status":"online"}'></textarea><button class="btn primary" onclick="fmt()">Format JSON</button><button class="btn" onclick="mini()">Minify</button></div>
<div class="card" id="password"><i>✦</i><h3>Password Generator</h3><input id="pass" readonly placeholder="Klik generate"><input id="len" type="number" value="16" min="6" max="64"><button class="btn primary" onclick="gen()">Generate</button><button class="btn" onclick="navigator.clipboard?.writeText(document.getElementById('pass').value)">Copy</button></div>
<div class="card"><i>◷</i><h3>Stopwatch</h3><h3 id="sw">00:00.0</h3><button class="btn primary" onclick="startSW()">Start</button><button class="btn" onclick="stopSW()">Pause</button><button class="btn" onclick="resetSW()">Reset</button></div>
</div>
<div class="card" style="margin-top:14px"><h3>URL Checker</h3><input id="url" placeholder="https://example.com"><button class="btn primary" onclick="checkUrl()">Cek URL</button><p id="urlout" style="margin-top:12px"></p></div>
<script>
function fmt(){try{json.value=JSON.stringify(JSON.parse(json.value),null,2)}catch(e){alert('JSON tidak valid')}}
function mini(){try{json.value=JSON.stringify(JSON.parse(json.value))}catch(e){alert('JSON tidak valid')}}
function gen(){let s='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';let n=Math.min(64,Math.max(6,+len.value||16)),o='';for(let i=0;i<n;i++)o+=s[Math.floor(Math.random()*s.length)];pass.value=o}
let swt=0,sti=null;function paint(){let t=swt/10,sec=Math.floor(t/10),ms=Math.floor(t%10);sw.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')+'.'+ms}
function startSW(){if(sti)return;sti=setInterval(()=>{swt++;paint()},100)}function stopSW(){clearInterval(sti);sti=null}function resetSW(){stopSW();swt=0;paint()}
async function checkUrl(){let u=url.value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;urlout.textContent='Menguji...';let t=performance.now();try{await fetch(u,{mode:'no-cors',cache:'no-store'});urlout.textContent='Permintaan berhasil dikirim • '+Math.round(performance.now()-t)+' ms (mode no-cors)'}catch(e){urlout.textContent='Gagal menjangkau URL dari browser ini.'}}
</script></section></main><footer><span>LUTFITECH © 2026</span><span>Digital Network Lab</span></footer><script src="../assets/js/app.js"></script>
